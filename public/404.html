<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Denzel Chingodza</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #0d0e12;
      color: #edeae0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 2rem;
    }

    .code {
      font-family: 'Orbitron', monospace;
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 700;
      color: #1a1b22;
      letter-spacing: -0.03em;
      line-height: 1;
      user-select: none;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #4a4a54;
      margin-top: 4px;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 400;
      color: #c8c4bc;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    p {
      color: rgba(237,234,224,0.3);
      font-size: 13px;
      max-width: 340px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9090a2;
      font-size: 12px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid #2a2b35;
      border-radius: 6px;
      padding: 10px 20px;
      transition: border-color 0.2s, color 0.2s;
    }
    a:hover { border-color: #5a5a6a; color: #edeae0; }
    a svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .tars-line {
      margin-top: 48px;
      font-size: 11px;
      color: #2a2b35;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="content">
    <div class="code">404</div>
    <p class="label">page not found</p>
    <h1>Nothing here.</h1>
    <p>The page you're looking for doesn't exist or was moved. Happens to the best of us.</p>
    <a href="/">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to home
    </a>
    <p class="tars-line">TARS: "I could've told you that."</p>
  </div>

  <script>
    const c = document.getElementById('stars');
    const ctx = c.getContext('2d');
    let W, H, stars = [];

    function resize() {
      W = c.width  = window.innerWidth;
      H = c.height = window.innerHeight;
      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        o: Math.random() * 0.5 + 0.1,
        s: Math.random() * 0.4 + 0.1,
        d: Math.random() > 0.5 ? 1 : -1,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      stars.forEach(s => {
        s.o += s.s * 0.008 * s.d;
        if (s.o > 0.6 || s.o < 0.05) s.d *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(184,180,168,${s.o})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    resize();
    draw();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
